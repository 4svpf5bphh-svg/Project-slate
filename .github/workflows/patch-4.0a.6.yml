name: one-shot v4.0a.6 AI finance normalization
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.0a.6 finance patch
        run: python .github/patches/patch_4_0a_6.py

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js

      - name: Text smoke checks
        run: |
          grep -q "const VERSION='4.0a.6';" index.html
          grep -q "v4.0a.6-ai-finance-normalization" index.html
          grep -q "rv.debt\*\.0025" index.html
          grep -q "draw\*1.05" index.html
          grep -q "audit-benchmark-v4005" index.html
          ! grep -q "audit-benchmark-v4006" index.html
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0a.6 normalize rival financing"
          git push
