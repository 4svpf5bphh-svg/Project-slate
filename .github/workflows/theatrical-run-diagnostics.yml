name: one-shot theatrical-run diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact theatrical functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          def extract(name):
              token=f"function {name}("
              i=s.find(token)
              print(f"\n===== {name} @ {i} =====")
              if i<0:return
              brace=s.find("{",i);depth=0;quote=None;esc=False;j=brace
              while j<len(s):
                  c=s[j]
                  if quote:
                      if esc: esc=False
                      elif c=="\\": esc=True
                      elif c==quote: quote=None
                  else:
                      if c in ("'", '"', "`"): quote=c
                      elif c=="{": depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:
                              j+=1;break
                  j+=1
              print(s[i:j])
          for name in ["processReleaseDay","finalizeTheatricalWeek","processBoxOfficeSunday","releaseFilm","addCinemaWeek","queueWeekendBoxOfficeMoment","finishFilm","theatricalStudioRevenue"]:
              extract(name)
          PY
