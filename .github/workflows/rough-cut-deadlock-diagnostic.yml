name: one-shot rough-cut deadlock diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect post UI source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["postUI","Post-production","Picture lock","lockPicture","firstDecisionMade","syncOperationalDeskItems","globalAdvanceWeek","globalAdvanceNextEvent","globalAdvanceNextDecision"]:
              print("\n===== "+term+" =====")
              for m in list(re.finditer(re.escape(term),s,re.I))[:30]:
                  print("\n---\n"+s[max(0,m.start()-2600):m.start()+11000])
          PY
