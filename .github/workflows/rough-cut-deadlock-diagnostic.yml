name: one-shot rough-cut deadlock diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect post render and navigation bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          terms=["function render(","function bind(","dataset.nav","backBtn)","getElementById('backBtn')","getElementById(\"backBtn\")","function filmDetail","function filmScreen","f.stage==='post'","postScreen","postDetail","Rough cut ready","firstDecisionMade"]
          for term in terms:
              print(f"\n===== {term} =====")
              hits=list(re.finditer(re.escape(term),s,re.I))
              print("count",len(hits))
              for m in hits[:20]:
                  print("\n---\n"+s[max(0,m.start()-2500):m.start()+9000])
          PY
