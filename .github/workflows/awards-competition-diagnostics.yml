name: one-shot awards-competition diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect awards race UI and nominations
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in [
            "function buildAwardsNominations(",
            "function awardsScreen(",
            "function awardsHub(",
            "function awardsNominationRecord(",
            "function triggerAwardsNominations(",
            "function ceremonyScreen(",
            "function awardsPushUI(",
            "data-awards-push"
          ]:
              print("\n===== "+term+" =====")
              i=s.find(term)
              print("index",i)
              if i>=0: print(s[max(0,i-1800):i+26000])
          PY
