name: one-shot awards-competition diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate awards UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in [
            "Focused awards",
            "Full-scale",
            "awardsPushCost(",
            "commitAwardsPush(",
            "uiStudioTab==='awards'",
            "uiStudioTab === 'awards'",
            "studioTab:'awards'",
            "Awards season",
            "awards archive",
            "Awards consideration"
          ]:
              print("\n===== "+term+" =====")
              hits=list(re.finditer(re.escape(term),s,re.I))
              print("count",len(hits))
              for m in hits[:20]:
                  print("\n---\n"+s[max(0,m.start()-5000):m.start()+12000])
          PY
