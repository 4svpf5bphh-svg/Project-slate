name: one-shot awards-competition diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List awards functions and UI anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          names=[m.group(1) for m in re.finditer(r"function\s+([A-Za-z0-9_]+)\s*\(",s) if re.search(r"award|nomination|ceremon",m.group(1),re.I)]
          print("FUNCTIONS",names)
          for term in ["commitAwardsPush(filmById","commitAwardsPush(","awardsPushCost(f,1)","awardsPushCost(f,2)","Awards &","AWARDS","uiStudioTab","studioScreen()"]:
              print("\n===== "+term+" =====")
              for m in list(re.finditer(re.escape(term),s,re.I))[:30]:
                  print("\n---\n"+s[max(0,m.start()-3500):m.start()+8000])
          PY
