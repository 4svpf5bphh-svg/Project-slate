name: one-shot rival-release diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect market settlement hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in [
            "function processBoxOfficeSunday","function settleWeekendBoxOffice",
            "settledRank","function boxPressureForWeek","function checkPlayerReleaseCompetition",
            "function rivalSignature","function aiStudioProfile","function distributionPlan",
            "function filmRowAtWorldWeek","function currentBoxChart"
          ]:
              print("\n===== "+term+" =====")
              i=s.find(term)
              print("index",i)
              if i>=0: print(s[max(0,i-1800):i+18000])
          PY
