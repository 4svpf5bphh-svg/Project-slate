name: one-shot trilogy milestone diagnostic
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect trilogy milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["function maxPlayerFranchiseInstallment","id:'trilogy'","function playerContinuationCount"]:
              print("\n===== "+term+" =====")
              i=s.find(term)
              print("index",i)
              if i>=0:
                  print(s[max(0,i-1800):i+5000])
          PY
