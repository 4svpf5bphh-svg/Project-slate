name: one-shot progression diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect progression tables
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["STUDIO_MILESTONES","LEGEND_ARCHIVE","function legendRequirementProgress","function buyStudioUpgrade","function registerStudioFilmImpact","function registerStudioAwardImpact","function renderStudio"]:
              print("\n\n===== "+term+" =====")
              starts=[]
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  starts.append(i);pos=i+1
              print("matches",starts[:20])
              for i in starts[:4]:
                  print("\n--- RAW CONTEXT ---\n"+s[max(0,i-12000):i+24000])
          PY
