name: one-shot v4.0c.3 awards competition
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.0c.3 awards patch
        run: python .github/patches/patch_4_0c_3.py

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js

      - name: Awards competition smoke checks
        run: |
          grep -q "const VERSION='4.0c.3';" index.html
          grep -q "function awardsSeasonMomentum" index.html
          grep -q "function awardsCompetitiveScore" index.html
          grep -q "function processAIAwardsCampaigns" index.html
          grep -q "function aiCommitAwardsPush" index.html
          grep -q "function awardsRaceBoardHTML" index.html
          grep -q "processAIAwardsCampaigns();maybeResolveAwardsNominations()" index.html
          grep -q "Escalate to full" index.html
          grep -q "awardsCompetitiveScore(f,cat.id,'nomination')" index.html
          grep -q "awardsCompetitiveScore(f,cat.id,'ceremony')" index.html
          grep -q "Race Board labels are an industry read, not a prediction" index.html
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0c.3 add awards competition"
          git push
