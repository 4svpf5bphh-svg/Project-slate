name: one-shot v4.0c.1 theatrical run
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.0c.1 theatrical-run patch
        run: python .github/patches/patch_4_0c_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js
      - name: Theatrical-run smoke checks
        run: |
          grep -q "const VERSION='4.0c.1';" index.html
          grep -q "const THEATRICAL_MOVES=" index.html
          grep -q "function applyTheatricalMove" index.html
          grep -q "function theatricalReleaseRoomHTML" index.html
          grep -q "In Theatres" index.html
          grep -q "Routine weekly performance now lives in the Release Room" index.html
          grep -q "data-theatrical-move" index.html
          grep -q "ensureTheatricalRunState(f)" index.html
          git diff --check
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0c.1 add theatrical release room"
          git push
