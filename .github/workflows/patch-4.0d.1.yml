name: one-shot v4.0d.1 causality clarity
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v4.0d.1 clarity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html");s=p.read_text(encoding="utf-8")

          def one(a,b,label):
              global s
              n=s.count(a)
              if n!=1: raise SystemExit(f"{label}: expected 1, found {n}")
              s=s.replace(a,b,1)

          def patch_fn(name,old,new,label):
              global s
              start=s.find("function "+name+"(")
              if start<0: raise SystemExit(name+" missing")
              end=s.find("\nfunction ",start+10)
              if end<0:end=len(s)
              chunk=s[start:end];n=chunk.count(old)
              if n!=1: raise SystemExit(f"{label}: expected 1, found {n}")
              s=s[:start]+chunk.replace(old,new,1)+s[end:]

          one("<title>Project Slate — Premium Presentation v4.0c.3</title>","<title>Project Slate — Premium Presentation v4.0d.1</title>","title")
          one("const VERSION='4.0c.3';","const VERSION='4.0d.1';","version")
          one("v4.0c.3-awards-competition","v4.0d.1-causality-clarity","audit label")

          helpers="""
          function productionChoiceFeedbackHTML(f){
           ensureProductionDepth(f);const ratio=(f.budget||0)/Math.max(1,scriptById(f.scriptId)?.naturalBudget||1),rows=[];
           rows.push(f.producerStrategy==='creative'?['Creative cover','More room for performance and direction; slightly looser cost control.','good']:f.producerStrategy==='commercial'?['Commercial discipline','More pace and clarity for a broad audience; some creative nuance may be traded away.','warn']:['Budget control','Stronger stability and overrun control; limited creative upside.','blue']);
           rows.push(f.effectsApproach==='digital'&&ratio<.9?['VFX funding risk','The digital ambition is above the budget level the effects plan is comfortable carrying.','bad']:f.effectsApproach==='digital'?['Technical ambition','Higher craft ceiling, with more exposure if schedule or budget slips.','good']:f.effectsApproach==='practical'?['In-camera emphasis','Tangible work can help actors and texture, but puts more pressure on the shooting schedule.','blue']:['Balanced execution','Hybrid effects spread technical risk without chasing the highest ceiling.','blue']);
           return '<div class="card" style="margin-top:12px"><div class="row"><strong>Executive notes</strong><span class="pill blue">Immediate read</span></div>'+rows.map(x=>'<div class="listrow"><div><strong>'+x[0]+'</strong><div class="small">'+x[1]+'</div></div><span class="pill '+x[2]+'">'+(x[2]==='good'?'Upside':x[2]==='bad'?'Risk':x[2]==='warn'?'Trade-off':'Context')+'</span></div>').join('')+'</div>';
          }
          function filmChoiceCallback(f){
           const m=f.metrics||{},ratio=(f.budget||0)/Math.max(1,scriptById(f.scriptId)?.naturalBudget||1);
           if(f.effectsApproach==='digital'&&ratio<.9)return 'The VFX-forward plan became a visible constraint: the ambition survived, but the funding never fully caught up.';
           if(f.producerStrategy==='creative'&&((m.performances||0)>=78||(m.direction||0)>=78))return 'The Creative Producer choice survived into the finished film as a real performance/directing strength.';
           if(f.producerStrategy==='commercial'&&((m.pacing||0)>=78||(m.clarity||0)>=78))return 'The Commercial Producer choice shows up in the finished film’s pace and clarity.';
           if(f.producerStrategy==='lean'&&(m.stability||0)>=76)return 'The Budget-Control Producer delivered the stronger production stability the studio paid for.';
           return '';
          }
          function filmOutcomeFactorsHTML(f){
           if(!f?.review)return '';const sc=scriptById(f.scriptId),ratio=(f.budget||0)/Math.max(1,sc?.naturalBudget||1),intel=f.releaseWeek?releaseWindowIntel(f,f.releaseWeek):null,rows=[];
           if(ratio<.8)rows.push(['Underfunded production','Budget was materially below the screenplay’s natural scale.','bad']);else if(ratio>=.95&&ratio<=1.18)rows.push(['Budget fit','Funding stayed close to the material’s natural scale.','good']);
           const cb=filmChoiceCallback(f);if(cb)rows.push(['Production strategy',cb,/constraint/i.test(cb)?'bad':'good']);
           if(intel?.pressure>=.18)rows.push(['Release competition',intel.text,'bad']);else if(intel)rows.push(['Release window',intel.text,'blue']);
           const mr=(f.marketing||0)/Math.max(1,marketingRecommended(f));if(mr<.5)rows.push(['Campaign reach','Marketing was well below the recommended level for this release.','bad']);else if(mr>=.9)rows.push(['Campaign reach','The campaign had enough paid support to convert awareness.','good']);
           if(f.review.audience>=84)rows.push(['Audience word of mouth','Strong audience response supported later-week demand.','good']);else if(f.review.audience<58)rows.push(['Audience word of mouth','Weak audience response left the run exposed after opening.','bad']);
           if(f.releaseProfile?.type==='breakout'||f.releaseProfile?.type==='sleeper')rows.push(['Run shape','Demand expanded beyond the normal opening pattern.','good']);else if(f.releaseProfile?.type==='bomb'||f.releaseProfile?.type==='frontloaded')rows.push(['Run shape','Demand was consumed too quickly for the investment behind the release.','bad']);
           return '<div class="section-title"><h2>Why it happened</h2><span class="small">Major causal signals · not hidden-score disclosure</span></div><div class="card">'+rows.slice(0,6).map(x=>'<div class="listrow"><div><strong>'+x[0]+'</strong><div class="small">'+x[1]+'</div></div><span class="pill '+x[2]+'">'+(x[2]==='good'?'Helped':x[2]==='bad'?'Hurt':'Context')+'</span></div>').join('')+'</div>';
          }
          function bridgeDebtProjection(q,weeks){return q*1.14*Math.pow(1+(state.finance?.weeklyInterest||0),weeks)}
          function bridgeRecoveryContext(){
           const fs=playerFilms().filter(f=>!['complete','shelved'].includes(f.stage)),c=fs.find(f=>f.stage==='cinema');if(c)return c.title+' is already generating theatrical receipts, but the remaining run is uncertain.';
           const d=fs.filter(f=>f.releaseWeek&&f.releaseWeek>=state.week).sort((a,b)=>a.releaseWeek-b.releaseWeek)[0];if(d){const w=d.releaseWeek-state.week;return d.title+' is the nearest dated release, opening in '+w+' week'+(w===1?'':'s')+'.';}
           const late=fs.find(f=>['post','marketing'].includes(f.stage));return late?late.title+' is nearest to release, but no theatrical cash date is committed yet.':'No near-term player film has a committed theatrical cash event.';
          }

          """
          one("function applyProductionDepthMetrics(f){",helpers+"function applyProductionDepthMetrics(f){","helpers")
          anchor='<div class="section-title"><h2>Creative brief</h2><span class="small">These choices also change which talent fits the project</span></div>';one(anchor,'  $'+'{productionChoiceFeedbackHTML(f)}\\n  '+anchor,"choice notes")
          anchor='${theatricalInterventionPanel(f)}\\n  <div class="section-title"><h2>The box-office race</h2>';one(anchor,'${theatricalInterventionPanel(f)}\\n  ${filmOutcomeFactorsHTML(f)}\\n  <div class="section-title"><h2>The box-office race</h2>',"cinema causality")
          anchor='<div class="section-title"><h2>What the review was responding to</h2>';one(anchor,'${filmOutcomeFactorsHTML(f)}\\n  '+anchor,"review causality")
          anchor='<div class="section-title"><h2>Career consequences</h2></div><div class="card body">${careerConsequenceText(f,profit)}</div>';one(anchor,'${filmOutcomeFactorsHTML(f)}\\n  '+anchor,"wrap causality")

          old="  else if(mode==='audition'&&t.star>=84)reason='The representatives declined to put the performer through an audition process for this role.';\n  else reason='The representatives passed on the role after reviewing the material and package.';"
          new="  else if(mode==='audition'&&t.star>=84)reason='The representatives declined to put the performer through an audition process for this role.';\n  else if(t.momentum>=82&&role.type==='lead')reason='Recent momentum has raised the bar for the performer’s next lead role; the representatives want more obvious career upside.';\n  else if((t.credits||[]).slice(-3).some(c=>c.genre===f.genre))reason='The agent feels this part is too close to the performer’s recent work.';\n  else reason='The representatives passed after weighing the role, package, studio relationship and the performer’s current career position.';"
          one(old,new,"declines")

          patch_fn("deskItemHTML"," const choices=x.choices||[],expanded=!x.read||x.expanded,status="," const choices=x.choices||[],expanded=x.requiresAction?(!x.read||x.expanded):!!x.expanded,status=","desk collapse")
          patch_fn("pushDeskItem","item=lotDeskVoice(item);","item=lotDeskVoice(item);item.expanded=!!item.requiresAction;","desk push")
          patch_fn("studioDeskBody","<h2>Inbox</h2>","<h2>Industry brief</h2>","desk heading")
          patch_fn("studioDeskBody","<span class=\"small\">Read items collapse to headlines</span>","<span class=\"small\">Awareness only · collapsed by default</span>","desk hint")
          patch_fn("filmWrapVerdictCopy","return first;","const choice=filmChoiceCallback(f);if(choice)first+=' '+choice;return first;","wrap callback")
          patch_fn("criticCraftParagraph","return line;","const choice=filmChoiceCallback(f);if(choice)line+=' '+choice;return line;","review callback")

          phrase="Receive ${money(q)} cash now. ${money(q*1.14)} will be added to bridge debt before weekly interest."
          repl="Receive ${money(q)} cash now. ${money(q*1.14)} enters bridge debt immediately. With no repayment, that draw alone becomes about <strong>${money(bridgeDebtProjection(q,4))}</strong> after 4 weeks and <strong>${money(bridgeDebtProjection(q,8))}</strong> after 8 weeks.<br><span class=\"small\"><strong>Nearest possible recovery:</strong> ${bridgeRecoveryContext()} Projection assumes the current rate and no repayment; future film revenue is not guaranteed.</span>"
          one(phrase,repl,"bridge quote")

          p.write_text(s,encoding="utf-8")
          print("Patched v4.0d.1 causality clarity")
          PY

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js

      - name: Causality and clarity smoke checks
        run: |
          grep -q "const VERSION='4.0d.1';" index.html
          grep -q "function productionChoiceFeedbackHTML" index.html
          grep -q "Executive notes" index.html
          grep -q "function filmOutcomeFactorsHTML" index.html
          grep -q "Why it happened" index.html
          grep -q "Major causal signals" index.html
          grep -q "function filmChoiceCallback" index.html
          grep -q "function bridgeDebtProjection" index.html
          grep -q "Nearest possible recovery" index.html
          grep -q "expanded=x.requiresAction?" index.html
          grep -q "Industry brief" index.html
          grep -q "Recent momentum has raised the bar" index.html
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0d.1 add causality and decision clarity"
          git push
