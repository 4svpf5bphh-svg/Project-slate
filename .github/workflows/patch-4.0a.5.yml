name: one-shot v4.0a.5 legacy catalogue and turnaround
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'v4.0a.5 legacy catalogue and turnaround rebalance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Project Slate
        run: python .github/patches/patch_4_0a_5.py

      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js

      - name: Text smoke checks
        run: |
          grep -q "const VERSION='4.0a.5';" index.html
          grep -q "aiLegacyCatalogueWeeklyRevenue" index.html
          grep -q "budgetAnchor" index.html
          grep -q "v4.0a.5-legacy-catalogue-turnaround" index.html
          git diff --check

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0a.5 legacy catalogue and turnaround rebalance"
          git push
