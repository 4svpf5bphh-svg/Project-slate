name: one-shot explain diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=["function wrapUI(","function filmTimelineEntries(","actorRoleFit","Passed on","producerStrategy","effectsApproach","careerConsequenceText","legacyReportHTML"]
          for term in terms:
              print("\n===== "+term+" =====")
              i=s.find(term)
              print("index",i)
              if i>=0:
                  print(s[max(0,i-2500):i+14000])
          PY
