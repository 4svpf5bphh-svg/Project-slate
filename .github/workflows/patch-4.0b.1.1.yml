name: one-shot v4.0b.1.1 trilogy milestone hotfix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hotfix
        run: python .github/patches/patch_4_0b_1_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js
      - name: Milestone smoke checks
        run: |
          grep -q "const VERSION='4.0b.1.1';" index.html
          grep -q "if(!continuation.length)return 0;" index.html
          grep -q "f.sequelInstallment||f.ip?.installment||2" index.html
          git diff --check
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0b.1.1 fix trilogy milestone progress"
          git push
