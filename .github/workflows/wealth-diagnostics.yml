name: one-shot wealth diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect capital allocation hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["opsMult","DISTRIBUTION_OPTIONS","distribution","weeklyRevenue","catalogue receipts","collectCatalogue","afterlife","studioOperatingScale","maybeOfferIPO","estimatedIPOProceeds","STREAMING_MODELS"]:
              print("\n===== "+term+" =====")
              hits=list(re.finditer(re.escape(term),s,re.I))
              print("count",len(hits))
              for m in hits[:30]:
                  print("\n---\n"+s[max(0,m.start()-1400):m.start()+4200])
          PY
