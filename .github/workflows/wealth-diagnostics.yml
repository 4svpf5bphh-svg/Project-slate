name: one-shot wealth diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect capital binding and catalogue hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["data-repay","confirmFinanceQuote","weeklyRevenue=","weeklyRevenue =","lastCatalogueReceipts","state.cash+=catalogue","state.cash += catalogue","refreshAfterlifeValuation","activeSlateOverhead"]:
              print("\n===== "+term+" =====")
              hits=list(re.finditer(re.escape(term),s,re.I))
              print("count",len(hits))
              for m in hits[:25]:
                  print("\n---\n"+s[max(0,m.start()-1800):m.start()+5000])
          PY
