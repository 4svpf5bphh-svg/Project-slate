name: one-shot v4.0b.2.1 rough-cut deadlock hotfix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rough-cut deadlock hotfix
        run: python .github/patches/patch_4_0b_2_1.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js
      - name: Deadlock smoke checks
        run: |
          grep -q "const VERSION='4.0b.2.1';" index.html
          grep -q "function routeToHardBlocker" index.html
          grep -q "if(state.detail){state.detail=null" index.html
          grep -q "function guardedPostUI" index.html
          grep -q "POST-PRODUCTION SAFE MODE" index.html
          grep -q "recoverPostMusic" index.html
          grep -q "routeToHardBlocker(blocker,true);save();render();return;" index.html
          git diff --check
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0b.2.1 fix rough-cut navigation deadlock"
          git push
