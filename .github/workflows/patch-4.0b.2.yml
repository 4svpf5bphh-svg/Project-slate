name: one-shot v4.0b.2 capital allocation
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4.0b.2 capital patch
        run: python .github/patches/patch_4_0b_2.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index("<script>")+len("<script>")
          end=s.rindex("</script>")
          Path("/tmp/project-slate.js").write_text(s[start:end],encoding="utf-8")
          PY
          node --check /tmp/project-slate.js
      - name: Capital-allocation smoke checks
        run: |
          grep -q "const VERSION='4.0b.2';" index.html
          grep -q "const CAPITAL_ASSETS=" index.html
          grep -q "capitalSlateMultiplier" index.html
          grep -q "capitalCatalogueMultiplier" index.html
          grep -q "capitalDistributionMultiplier" index.html
          grep -q "data-capital-asset" index.html
          grep -q "first_capital_asset" index.html
          grep -q "all_capital_assets" index.html
          grep -q "capitalAssets:+capitalAssets.toFixed" index.html
          git diff --check
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v4.0b.2 add capital allocation"
          git push
