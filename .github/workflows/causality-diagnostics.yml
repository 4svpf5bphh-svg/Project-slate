name: one-shot v4.0d.1 causality diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          def emit(name):
              token="function "+name+"("
              i=s.find(token)
              print("\n###OUT "+name+"###")
              if i<0:
                  print("NOT FOUND"); return
              b=s.find("{",i);d=0;q=None;esc=False;j=b
              while j<len(s):
                  c=s[j]
                  if q:
                      if esc: esc=False
                      elif c=="\\": esc=True
                      elif c==q: q=None
                  else:
                      if c in ("'", '"', "`"): q=c
                      elif c=="{": d+=1
                      elif c=="}":
                          d-=1
                          if d==0: j+=1; break
                  j+=1
              print(s[i:j])
          for n in ["deskItemHTML","buildFilmLegacy","filmTimelineEntries","reviewUI","filmDetail","filmUI","filmScreen","completeFilm","resolveReview"]:
              emit(n)
          PY
