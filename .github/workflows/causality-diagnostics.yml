name: one-shot v4.0d.1 causality diagnostics
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cinema UI and bind hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["function cinemaUI(f)","data-producer-strategy","data-effects-approach"]:
              print("\n###TERM "+term+"###")
              i=s.find(term);print(s[max(0,i-1500):i+15000] if i>=0 else "NOT FOUND")
          PY
