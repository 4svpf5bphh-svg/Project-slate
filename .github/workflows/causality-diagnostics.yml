name: one-shot v4.0d.1 causality diagnostics
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact clarity hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          for term in [
            "function talentDeclineForRole(",
            "function talentProjectInterest(",
            "function deskItemHTML(",
            "function addDesk",
            "function ensureDesk(",
            "function buildFilmLegacy(",
            "function filmDetailScreen(",
            "function filmDetail(",
            "function filmTimelineEntries(",
            "function reviewUI(",
            "function reviewScreen(",
            "function producerStrategy(",
            "function effectsApproach(",
            "function setProducer",
            "function setEffects",
            "function generateTitle(",
            "function createScript"
          ]:
              print("\n===== "+term+" =====")
              i=s.find(term)
              print("index",i)
              if i>=0: print(s[max(0,i-1800):i+22000])
          PY
